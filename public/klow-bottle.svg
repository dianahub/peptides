<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 200" width="120" height="200" role="img" aria-label="KLOW peptide blend bottle">
  <!-- Bottle neck -->
  <rect x="44" y="20" width="32" height="18" rx="4" fill="#1e40af"/>
  <!-- Bottle cap -->
  <rect x="40" y="10" width="40" height="14" rx="6" fill="#1d4ed8"/>
  <!-- Bottle body -->
  <rect x="22" y="36" width="76" height="130" rx="12" fill="#2563eb"/>
  <!-- Bottle shine -->
  <rect x="30" y="45" width="12" height="80" rx="6" fill="#93c5fd" opacity="0.4"/>
  <!-- Label background -->
  <rect x="28" y="68" width="64" height="70" rx="6" fill="white" opacity="0.92"/>
  <!-- KLOW text -->
  <text x="60" y="100" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="900" fill="#1e3a8a" letter-spacing="2">KLOW</text>
  <!-- Tagline -->
  <text x="60" y="116" text-anchor="middle" font-family="sans-serif" font-size="6.5" fill="#3b82f6" letter-spacing="0.5">BEAUTY · VITALITY · POWER</text>
  <!-- Divider -->
  <line x1="36" y1="122" x2="84" y2="122" stroke="#bfdbfe" stroke-width="1"/>
  <!-- Peptide names -->
  <text x="60" y="132" text-anchor="middle" font-family="sans-serif" font-size="5.5" fill="#1e40af">GHK-Cu · BPC-157</text>
  <text x="60" y="142" text-anchor="middle" font-family="sans-serif" font-size="5.5" fill="#1e40af">TB-500 · KPV</text>
  <!-- Bottom shine -->
  <ellipse cx="60" cy="164" rx="35" ry="6" fill="#1d4ed8" opacity="0.3"/>
</svg>
